<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Assistant Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #ffffff; color: #1a1a2e; height: 100vh; overflow: hidden; }
        .app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; background: #ffffff; position: relative; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #e8e8ef; background: #ffffff; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: #1a1a2e; text-decoration: none; }
        .logo svg { width: 32px; height: 32px; }
        .logo .highlight { color: #4285f4; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .header-btn { padding: 8px 14px; border: none; background: transparent; color: #4a4a6a; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .header-btn:hover { background: #f0f0f5; color: #1a1a2e; }
        .messages-container { flex: 1; overflow-y: auto; padding: 24px 32px; background: #fafafa; scroll-behavior: smooth; }
        .messages-container::-webkit-scrollbar { width: 6px; }
        .messages-container::-webkit-scrollbar-thumb { background: #d0d0dd; border-radius: 8px; }
        .message-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; animation: fadeUp 0.3s ease; }
        .message-group.user { align-items: flex-end; }
        .message-group.assistant { align-items: flex-start; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .message { max-width: 85%; padding: 12px 18px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-wrap: break-word; }
        .message.user { background: #4285f4; color: white; border-bottom-right-radius: 4px; }
        .message.assistant { background: #ffffff; color: #1a1a2e; border: 1px solid #e8e8ef; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .message.assistant pre { background: #1a1a2e; color: #e4e4f0; padding: 14px 18px; border-radius: 10px; overflow-x: auto; margin: 8px 0; font-size: 13px; font-family: 'Fira Code', 'Consolas', monospace; }
        .message.assistant code { background: #f0f0f5; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .message.assistant pre code { background: transparent; padding: 0; }
        .message.assistant ul, .message.assistant ol { padding-left: 24px; margin: 6px 0; }
        .message.assistant p { margin: 4px 0; }
        .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; color: #4a4a6a; }
        .welcome h2 { font-size: 28px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
        .welcome p { font-size: 15px; color: #6a6a8a; max-width: 400px; }
        .welcome .suggestions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; justify-content: center; }
        .suggestion-chip { padding: 8px 16px; border: 1px solid #e0e0ea; border-radius: 20px; background: white; color: #4a4a6a; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .suggestion-chip:hover { border-color: #4285f4; color: #4285f4; background: #f5f7ff; }
        .input-area { padding: 16px 24px 24px; background: #ffffff; border-top: 1px solid #e8e8ef; flex-shrink: 0; }
        .input-wrapper { display: flex; align-items: flex-end; gap: 12px; background: #f5f5fa; border-radius: 16px; padding: 8px 12px 8px 18px; border: 2px solid transparent; transition: border-color 0.2s; }
        .input-wrapper:focus-within { border-color: #4285f4; background: #ffffff; }
        .input-wrapper input { flex: 1; border: none; background: transparent; padding: 10px 0; font-size: 15px; font-family: inherit; color: #1a1a2e; outline: none; }
        .input-wrapper input::placeholder { color: #8a8aaa; }
        .input-wrapper input:disabled { opacity: 0.6; }
        .input-actions { display: flex; align-items: center; gap: 6px; padding-bottom: 4px; }
        .input-actions .send-btn { padding: 8px 18px; border: none; background: #4285f4; color: white; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .input-actions .send-btn:hover { background: #3367d6; }
        .input-actions .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer { text-align: center; padding: 8px 24px 12px; font-size: 12px; color: #8a8aaa; background: #ffffff; flex-shrink: 0; }
        .footer a { color: #4285f4; text-decoration: none; cursor: pointer; }
        .footer a:hover { text-decoration: underline; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.3s ease; }
        .modal-overlay.hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal { background: white; border-radius: 20px; padding: 40px; max-width: 460px; width: 90%; box-shadow: 0 24px 64px rgba(0,0,0,0.2); }
        .modal h2 { font-size: 22px; margin-bottom: 8px; color: #1a1a2e; }
        .modal p { color: #6a6a8a; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .modal input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0ea; border-radius: 12px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; margin-bottom: 12px; }
        .modal input:focus { border-color: #4285f4; }
        .modal .btn-group { display: flex; gap: 10px; }
        .modal .btn-group button { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .modal .btn-group .btn-primary { background: #4285f4; color: white; }
        .modal .btn-group .btn-primary:hover { background: #3367d6; }
        .modal .btn-group .btn-secondary { background: #f0f0f5; color: #4a4a6a; }
        .modal .btn-group .btn-secondary:hover { background: #e0e0ea; }
        .modal .api-link { display: block; text-align: center; margin-top: 12px; color: #4285f4; font-size: 13px; }
        .error-msg { color: #d32f2f; font-size: 12px; margin-top: 8px; display: none; }
        @media (max-width: 600px) { .messages-container { padding: 16px; } .message { max-width: 92%; font-size: 14px; padding: 10px 14px; } .input-area { padding: 12px 16px 16px; } .header { padding: 12px 16px; } .header .logo span { font-size: 16px; } .welcome h2 { font-size: 22px; } .modal { padding: 24px; } }
    </style>
</head>
<body>

    <div class="app" id="app">
        <header class="header">
            <div class="header-left">
                <a href="#" class="logo">
                    <svg viewBox="0 0 32 32" fill="none">
                        <rect x="2" y="2" width="28" height="28" rx="8" fill="#4285f4" />
                        <path d="M10 22V10L16 16L22 10V22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>Study<span class="highlight">Assistant</span></span>
                </a>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="clearChat()">✕ New Chat</button>
                <button class="header-btn" onclick="document.getElementById('apiModal').classList.toggle('hidden')">⚙️</button>
            </div>
        </header>

        <div class="messages-container" id="messagesContainer">
            <div class="welcome" id="welcomeScreen">
                <h2>How can I help you today?</h2>
                <p>Your free AI study assistant — powered by Google Gemini.</p>
                <div class="suggestions">
                    <button class="suggestion-chip" onclick="sendSuggestion('Explain quantum computing simply')">✨ Quantum computing</button>
                    <button class="suggestion-chip" onclick="sendSuggestion('Write a Python function to sort a list')">🐍 Python sort</button>
                    <button class="suggestion-chip" onclick="sendSuggestion('What are the best study techniques?')">📚 Study tips</button>
                    <button class="suggestion-chip" onclick="sendSuggestion('Summarize the plot of 1984')">📖 Book summary</button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask me anything..." maxlength="4000" />
                <div class="input-actions">
                    <button class="send-btn" id="sendBtn">Send</button>
                </div>
            </div>
        </div>

        <div class="footer">
            Free · ⚡ Powered by Gemini 2.5 Flash-Lite · <a onclick="document.getElementById('apiModal').classList.remove('hidden')">Set API key</a>
        </div>
    </div>

    <div class="modal-overlay hidden" id="apiModal">
        <div class="modal">
            <h2>🔑 Gemini API Key</h2>
            <p>Get your <strong>free</strong> key from <a href="https://makersuite.google.com/app/apikey" target="_blank">Google AI Studio</a>.</p>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key here..." />
            <div id="keyError" class="error-msg">❌ Invalid key. Please paste the full key.</div>
            <div class="btn-group">
                <button class="btn-primary" onclick="saveApiKey()">Save Key</button>
                <button class="btn-secondary" onclick="document.getElementById('apiModal').classList.add('hidden')">Cancel</button>
            </div>
            <a href="https://makersuite.google.com/app/apikey" target="_blank" class="api-link">Get your free API key →</a>
        </div>
    </div>

    <script>
        // ================================================================
        //  GEMINI API — ULTRA FAST with gemini-2.5-flash-lite
        //  Uses streaming SSE for instant response appearance
        //  No unnecessary fields — just speed.
        // ================================================================

        let API_KEY = localStorage.getItem('gemini_api_key') || '';
        let conversation = [];
        let isProcessing = false;

        // The current fastest, most stable model
        const MODEL = 'gemini-2.5-flash-lite';

        const container = document.getElementById('messagesContainer');
        const welcome = document.getElementById('welcomeScreen');
        const inputEl = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modal = document.getElementById('apiModal');
        const apiInput = document.getElementById('apiKeyInput');
        const keyError = document.getElementById('keyError');

        function sendSuggestion(text) {
            inputEl.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isProcessing) return;

            if (!API_KEY || API_KEY.length < 10) {
                modal.classList.remove('hidden');
                apiInput.focus();
                return;
            }

            welcome.style.display = 'none';
            inputEl.value = '';
            inputEl.disabled = true;
            sendBtn.disabled = true;
            isProcessing = true;

            // Add user message
            addMessage(text, 'user');
            conversation.push({ role: 'user', parts: [{ text: text }] });

            // Create empty message container for streaming
            const group = document.createElement('div');
            group.className = 'message-group assistant';
            const msg = document.createElement('div');
            msg.className = 'message assistant';
            msg.innerHTML = '▌';
            group.appendChild(msg);
            container.appendChild(group);
            scrollToBottom();

            try {
                // Simple, clean request — only generationConfig
                const requestBody = {
                    contents: conversation,
                    generationConfig: {
                        temperature: 0.7,
                        maxOutputTokens: 1024,  // faster response
                        topP: 0.95
                    }
                };

                console.log('🚀 Sending request to:', MODEL);

                // Use the streaming endpoint
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:streamGenerateContent?key=${API_KEY}&alt=sse`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    }
                );

                if (!response.ok) {
                    const errorData = await response.json();
                    let errMsg = errorData.error?.message || `Error ${response.status}`;
                    if (response.status === 403) errMsg = 'Invalid API key. Please check your key.';
                    if (response.status === 429) errMsg = 'Rate limit exceeded. Please wait.';
                    addMessage(`❌ ${errMsg}`, 'error');
                    conversation.pop();
                    group.remove();
                    return;
                }

                // Process the SSE stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullReply = '';
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const json = JSON.parse(data);
                                const chunk = json.candidates?.[0]?.content?.parts?.[0]?.text;
                                if (chunk) {
                                    fullReply += chunk;
                                    msg.innerHTML = formatText(fullReply) + '▌';
                                    scrollToBottom();
                                }
                            } catch (e) {
                                // Ignore parse errors
                            }
                        }
                    }
                }

                // Finalize
                if (fullReply) {
                    msg.innerHTML = formatText(fullReply);
                    conversation.push({ role: 'model', parts: [{ text: fullReply }] });
                } else {
                    addMessage('❌ No response received. Please try again.', 'error');
                    conversation.pop();
                    group.remove();
                }

            } catch (error) {
                addMessage(`❌ Network error: ${error.message}`, 'error');
                conversation.pop();
                group.remove();
            } finally {
                inputEl.disabled = false;
                sendBtn.disabled = false;
                isProcessing = false;
                inputEl.focus();
            }
        }

        function addMessage(content, role) {
            const group = document.createElement('div');
            group.className = `message-group ${role}`;
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            if (role === 'assistant') {
                msg.innerHTML = formatText(content);
            } else if (role === 'error') {
                msg.textContent = content;
                msg.style.background = '#fee';
                msg.style.color = '#c00';
                msg.style.border = '1px solid #fcc';
            } else {
                msg.textContent = content;
            }
            group.appendChild(msg);
            container.appendChild(group);
            scrollToBottom();
            return group;
        }

        function formatText(text) {
            let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            html = html.split('\n\n').map(p => {
                if (p.trim().startsWith('<') || p.trim() === '') return p;
                return `<p>${p.replace(/\n/g, '<br />')}</p>`;
            }).join('');
            html = html.replace(/<p>[-*] (.+)<\/p>/g, '<ul><li>$1</li></ul>');
            html = html.replace(/<ul><li>([\s\S]*?)<\/li><\/ul><ul><li>/g, '<ul><li>$1</li><li>');
            html = html.replace(/<\/ul><ul>/g, '');
            html = html.replace(/<p>(\d+)\. (.+)<\/p>/g, '<ol><li>$2</li></ol>');
            html = html.replace(/<ol><li>([\s\S]*?)<\/li><\/ol><ol><li>/g, '<ol><li>$1</li><li>');
            html = html.replace(/<\/ol><ol>/g, '');
            return html;
        }

        function scrollToBottom() {
            setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
        }

        function clearChat() {
            if (isProcessing) return;
            document.querySelectorAll('.message-group').forEach(el => el.remove());
            welcome.style.display = 'flex';
            conversation = [];
            inputEl.value = '';
            inputEl.focus();
        }

        function saveApiKey() {
            const key = apiInput.value.trim();
            if (key && key.length > 5) {
                API_KEY = key;
                localStorage.setItem('gemini_api_key', key);
                modal.classList.add('hidden');
                keyError.style.display = 'none';
                apiInput.value = '';
                inputEl.focus();
                addMessage('✅ API key saved! Using ' + MODEL, 'assistant');
            } else {
                keyError.style.display = 'block';
                keyError.textContent = '❌ Please paste your full API key.';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });
        apiInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveApiKey(); });

        if (API_KEY) apiInput.value = API_KEY;
        inputEl.focus();

        if (!API_KEY || API_KEY.length < 5) {
            setTimeout(() => { modal.classList.remove('hidden'); apiInput.focus(); }, 500);
        }

        console.log('🚀 Study Assistant ready with ULTRA FAST model:', MODEL);
        console.log('📡 Using SSE streaming for instant responses.');
    </script>

</body>
</html>
